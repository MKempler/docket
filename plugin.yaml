name: docket
version: 0.1.1
description: "Quotes for trades businesses: exact prices from your own price book, approve with one tap, the customer accepts, the job is booked."
author: Max Kempler
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/MKempler/docket
tags: [business, trades, quotes, telegram]
requires_hermes: ">=0.22.7"
provides_tools:
  - docket_price_preview
  - docket_quote
  - docket_send_quote
  - docket_jobs
  - docket_close_job
  - docket_pricebook_edit
  - docket_pricebook_save
  - docket_followups
  - docket_run_sheet
  - docket_pipeline
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - pre_transcription
config_schema:
  business_name:
    type: string
    label: Business name
    description: "Shown on quotes, PDFs, invoices and the customer page. Leave blank to use the name in your price book."
  business_phone:
    type: string
    label: Phone
    description: "Shown on quotes and the customer page."
  business_email:
    type: string
    label: Email
    description: "Shown on quotes and invoices, and used as the reply-to on quote emails in the outbox."
  license:
    type: string
    label: License number
    description: "Printed on quote and invoice PDFs."
  quote_valid_days:
    type: integer
    label: Quotes valid for (days)
    default: 30
    description: "How long a customer's accept link works, and the 'valid until' date on the quote PDF."
  invoice_due_days:
    type: integer
    label: Invoices due in (days)
    default: 14
    description: "Due date on invoices made at close-out."
  payment_terms:
    type: string
    label: Payment terms
    description: "Text printed on invoices, e.g. 'Net 14. Check, card or bank transfer.'"
  public_link:
    type: string
    label: Public link for customers
    description: "Base URL customers open quotes at, e.g. your tunnel (https://quotes.example.com). Blank = this computer only (http://127.0.0.1:8787)."
  followup_after_days:
    type: integer
    label: Follow up after (days)
    default: 5
    description: "Quotes unanswered this long show up in follow-ups and the weekday follow-up automation."
