name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: docket            # tests import the package as `docket`
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r docket/requirements-dev.txt
      - name: Unit tests
        working-directory: docket
        run: python -m pytest -q
      - name: Manifest is consistent
        working-directory: docket
        run: |
          python - <<'PY'
          import re, tomllib
          from ruamel.yaml import YAML
          m = YAML(typ="safe").load(open("plugin.yaml"))
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert m["version"] == version, f"plugin.yaml {m['version']} != pyproject {version}"
          src = open("__init__.py").read()
          registered = set(re.findall(r'register_tool\(name="([a-z_]+)"', src))
          registered |= set(re.findall(r'"name": "(docket_[a-z_]+)"', src))
          missing = set(m["provides_tools"]) - registered
          assert not missing, f"declared but not registered: {missing}"
          print(f"plugin.yaml {version}: {len(m['provides_tools'])} tools, {len(m['provides_hooks'])} hooks, "
                f"{len(m.get('config_schema', {}))} settings")
          PY
      - name: Desktop plugin parses
        if: matrix.python == '3.13'
        working-directory: docket
        run: node --check desktop/plugin.js
